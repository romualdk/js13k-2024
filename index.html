<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Triskai-deka-phobia</title>
  <meta name="description" content="Card game with deadly 13th card.">
	<meta name="author" content="Romuald Kowalczyk">
	<meta name="theme-color" content="#3770ea">
  <link rel="shortcut icon" href="img/icon.svg" type="image/svg">
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="app.webmanifest">
  <script src="zzfx.js" defer></script>
  <script src="index.js" defer></script>
</head>
<body>
  <div id="noise"></div>
  <div id="overlay"></div>
<div id="ctx">

  <<div class="button stage">
    <svg width="100%" height="100%">
      <defs>
      <linearGradient id="gradient" x1="0" x2="0" y1="0" y2="1">
        <stop class="stop1" offset="0%" stop-color="#efe5b4ff" />
        <stop class="stop2" offset="100%" stop-color="#f4d474ff" />
      </linearGradient>
      <filter id="f1" x="0" y="0">
<feGaussianBlur in="SourceGraphic" stdDeviation="3" />
</filter>
      </defs>
      <text class="stagetext" id="stage" x="50%" y="50%" fill="url(#gradient)">⚔️ Attack & Defend 🛡️</text>
      <text class="stagetext" id="stageb" x="50%" y="50%" fill="url(#gradient)" filter="url(#f1)">⚔️ Attack & Defend 🛡️</text>
    </svg>
  </div>

  <div id="hands">
    <div class="hand" style="left: 250px; top: 450px;"><img src="img/hand.svg" style="transform: scale(-1.3, 1.3);" /></div>
    <div class="hand" style="left: 550px; top: 450px;"><img src="img/hand.svg" style="transform: scale(-1.3, 1.3);" /></div>
  </div>
</div>
</body>
</html>
